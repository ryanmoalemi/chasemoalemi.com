<body>

  <main id="content">
    <section class="hero">
      <div class="hero-heading">
        <!-- Replace images/chase.jpg to swap in a photo. The CM initials show if that file is missing. -->
        <div class="portrait-wrap">
          <img class="portrait" src="images/chase.jpg" alt="Chase Moalemi" width="88" height="88" onerror="this.closest('.portrait-wrap').classList.add('is-fallback')">
          <span class="portrait-fallback" aria-hidden="true">CM</span>
        </div>
        <h1 aria-label="Hi, I'm Chase Moalemi">
          <span class="typewrite" aria-hidden="true">
            <span class="typewrite-ghost">Hi, I'm <span class="accent">Chase Moalemi</span><span class="typewrite-cursor typewrite-cursor-reserve">|</span></span>
            <span class="typewrite-row"><span class="typewrite-text"></span><span class="typewrite-cursor">|</span></span>
          </span>
        </h1>
      </div>
      <script>
          (function () {
            var root = document.querySelector(".typewrite");
            if (!root || !document.documentElement.classList.contains("type-on")) return;
            var text = root.querySelector(".typewrite-text");
            var full = "Hi, I'm Chase Moalemi";
            var name = "Chase Moalemi";
            var nameAt = full.indexOf(name);
            var nameEnd = nameAt + name.length;
            var i = 0;
            function paint() {
              var before = full.slice(0, Math.min(i, nameAt));
              var mid = i > nameAt ? full.slice(nameAt, Math.min(i, nameEnd)) : "";
              var after = i > nameEnd ? full.slice(nameEnd, i) : "";
              text.replaceChildren();
              if (before) text.append(document.createTextNode(before));
              if (mid) {
                var em = document.createElement("span");
                em.className = "accent";
                em.textContent = mid;
                text.append(em);
              }
              if (after) text.append(document.createTextNode(after));
            }
            function tick() {
              if (i >= full.length) return;
              i += 1;
              paint();
              if (i < full.length) window.setTimeout(tick, 70);
            }
            window.setTimeout(tick, 70);
          })();
      </script>
      <p class="lede">More soon.</p>
    </section>

    <section class="section" id="about" hidden>
      <div class="section-head">
        <h2>About</h2>

  <footer class="foot">
    <p>© <span id="year">2026</span> Chase Moalemi</p>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    var photo = document.querySelector(".portrait");
    if (photo && photo.complete && photo.naturalWidth === 0) {
      photo.closest(".portrait-wrap").classList.add("is-fallback");
    }

    document.querySelectorAll(".section").forEach(function (section) {
      var body = section.querySelector(".section-body");
      if (!body) return;
      var text = (body.textContent || "").replace(/\s+/g, "");
      var media = body.querySelector("img, video, audio, iframe, picture, svg");
      if (text.length > 0 || media) section.hidden = false;
    });
  </script>
