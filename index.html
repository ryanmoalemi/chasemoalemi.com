          <img src="/images/chase-moalemi.webp" srcset="/images/chase-moalemi.webp 1x, /images/chase-moalemi-800.webp 2x" width="88" height="88" alt="Chase Moalemi">
        </div>
        <h1 id="hero-title" aria-label="Hi, I’m Chase Moalemi">
          <span class="typewrite" aria-hidden="true">
            <span class="typewrite-ghost"><span class="hero-hello">Hi, I’m</span> <span class="accent">Chase Moalemi</span><span class="typewrite-cursor typewrite-cursor-reserve">|</span></span>
            <span class="typewrite-row"><span class="typewrite-text"></span><span class="typewrite-cursor">|</span></span>
          </span>
        </h1>
        <script>
          (function () {
            var root = document.querySelector(".typewrite");
            if (!root || !document.documentElement.classList.contains("type-on")) return;
            var text = root.querySelector(".typewrite-text");
            var full = "Hi, I’m Chase Moalemi";
            var name = "Chase Moalemi";
            var nameAt = full.indexOf(name);
            var nameEnd = nameAt + name.length;
            var i = 0;
            function paint() {
              var before = full.slice(0, Math.min(i, nameAt));
              var mid = i > nameAt ? full.slice(nameAt, Math.min(i, nameEnd)) : "";
              var after = i > nameEnd ? full.slice(nameEnd, i) : "";
              text.replaceChildren();
              if (before) {
                var helloText = before;
                var trail = "";
                if (before.charAt(before.length - 1) === " ") {
                  helloText = before.slice(0, -1);
                  trail = " ";
                }
                if (helloText) {
                  var hello = document.createElement("span");
                  hello.className = "hero-hello";
                  hello.textContent = helloText;
                  text.append(hello);
                }
                if (trail) text.append(document.createTextNode(trail));
              }
              if (mid) {
                var em = document.createElement("span");
                em.className = "accent";
                em.textContent = mid;
                text.append(em);
              }
              if (after) text.append(document.createTextNode(after));
            }
            function tick() {
              if (i >= full.length) return;
              i += 1;
              paint();
              if (i < full.length) window.setTimeout(tick, 70);
            }
            window.setTimeout(tick, 70);
          })();
        </script>
      </div>
      <p class="hero-intro">This is where I share what I’m building with AI, the cards I’m collecting, and whatever’s on my mind about sports.</p>
